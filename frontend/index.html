<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LennyCat Service Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%23f7efe4'/%3E%3Cpath d='M34 42l12-18 12 18 10-14 14 14 10-20 14 20 4 26-10 30H42L30 68l4-26z' fill='%23f59e0b'/%3E%3Cpath d='M42 52h44l-8 22H50z' fill='%23f8d58d'/%3E%3Cpath d='M46 62h36v10H46z' fill='%23f97316'/%3E%3Cpath d='M59 27l8-12 8 12' stroke='%23b45309' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M46 88l10 16 12-10 10 10 12-16' stroke='%234a2c15' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='52' cy='56' r='3' fill='%234a2c15'/%3E%3Ccircle cx='76' cy='56' r='3' fill='%234a2c15'/%3E%3Cpath d='M58 70c6 5 12 5 18 0' stroke='%234a2c15' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
      <header class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%23f7efe4'/%3E%3Cpath d='M34 42l12-18 12 18 10-14 14 14 10-20 14 20 4 26-10 30H42L30 68l4-26z' fill='%23f59e0b'/%3E%3Cpath d='M42 52h44l-8 22H50z' fill='%23f8d58d'/%3E%3Cpath d='M46 62h36v10H46z' fill='%23f97316'/%3E%3Cpath d='M59 27l8-12 8 12' stroke='%23b45309' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M46 88l10 16 12-10 10 10 12-16' stroke='%234a2c15' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='52' cy='56' r='3' fill='%234a2c15'/%3E%3Ccircle cx='76' cy='56' r='3' fill='%234a2c15'/%3E%3Cpath d='M58 70c6 5 12 5 18 0' stroke='%234a2c15' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" alt="LennyCat logo" class="w-10 h-10 rounded-lg" />
          <h1 class="text-2xl font-semibold">LennyCat Service Monitor</h1>
        </div>
        <div id="user-area"></div>
      </header>

      <div id="login" class="max-w-md mx-auto bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Admin Login</h2>
        <label class="block mb-2">Username
          <input id="username" class="w-full border rounded p-2" value="admin" />
        </label>
        <label class="block mb-2">Password
          <input id="password" type="password" class="w-full border rounded p-2" value="admin" />
        </label>
        <button id="login-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
      </div>

      <div id="app" class="hidden">
        <section class="bg-white p-4 rounded shadow mb-4">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold">Services</h2>
            <button id="add-service-btn" class="bg-green-600 text-white px-3 py-1 rounded">Add</button>
          </div>
          <div id="services-list" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

        <section class="bg-white p-4 rounded shadow">
          <h2 class="font-semibold mb-2">Home Assistant</h2>
          <label class="block mb-2">URL
            <input id="ha-url" class="w-full border rounded p-2" placeholder="http://homeassistant:8123" />
          </label>
          <label class="block mb-2">Long-Lived Token
            <input id="ha-token" class="w-full border rounded p-2" placeholder="Bearer token" />
          </label>
          <div class="flex gap-2">
            <button id="ha-save" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
            <button id="ha-check" class="bg-gray-600 text-white px-4 py-2 rounded">Check</button>
          </div>
          <div id="ha-status" class="mt-2 text-sm text-gray-700"></div>
          <div class="mt-4">
            <h3 class="font-semibold mb-2">Network overview</h3>
            <div id="ha-network-summary"></div>
            <button id="network-details-toggle" type="button" class="mt-3 border rounded px-3 py-1 text-sm">Show details</button>
            <div id="ha-network-details" class="hidden mt-3"></div>
          </div>
        </section>

        <section class="bg-white p-4 rounded shadow mt-4">
          <h2 class="font-semibold mb-2">Network Monitor</h2>
          <div id="network-monitor-summary"></div>
        </section>

        <section class="bg-white p-4 rounded shadow mt-4">
          <h2 class="font-semibold mb-2">Email Alerts</h2>
          <label class="block mb-2">Enabled
            <input id="email-enabled" type="checkbox" class="ml-2" />
          </label>
          <label class="block mb-2">SMTP Host
            <input id="email-smtp-host" class="w-full border rounded p-2" placeholder="smtp.gmail.com" />
          </label>
          <label class="block mb-2">SMTP Port
            <input id="email-smtp-port" class="w-full border rounded p-2" type="number" value="587" />
          </label>
          <label class="block mb-2">Username
            <input id="email-username" class="w-full border rounded p-2" placeholder="you@example.com" />
          </label>
          <label class="block mb-2">Password
            <input id="email-password" type="password" class="w-full border rounded p-2" placeholder="App password" />
          </label>
          <label class="block mb-2">From Email
            <input id="email-from" class="w-full border rounded p-2" placeholder="you@example.com" />
          </label>
          <label class="block mb-2">To Email
            <input id="email-to" class="w-full border rounded p-2" placeholder="alerts@example.com" />
          </label>
          <label class="block mb-2">Use TLS
            <input id="email-use-tls" type="checkbox" class="ml-2" checked />
          </label>
          <div class="flex gap-2">
            <button id="email-save" class="bg-blue-600 text-white px-4 py-2 rounded">Save alerts</button>
          </div>
          <div id="email-status" class="mt-2 text-sm text-gray-700"></div>
        </section>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

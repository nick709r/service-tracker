version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "6868:6868"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "6969:80"
    depends_on:
      - backend

# Optional: add a reverse-proxy service (traefik/nginx) later

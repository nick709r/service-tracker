version: '3.8'

services:
  backend:
    build: ./backend
    network_mode: host
    volumes:
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    network_mode: host
    depends_on:
      - backend

# Host networking allows the monitor to reach services on the same LAN as the host.
# This avoids the Docker bridge network isolation that prevents local-network checks.
